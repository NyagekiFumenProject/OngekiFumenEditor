name: Deploy Browser to GitHub and Cloudflare Pages

on:
  push:
    branches:
      - avalonia
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  BROWSER_PROJECT: Avalonia/src/OngekiFumenEditor.Avalonia.Browser/OngekiFumenEditor.Avalonia.Browser.csproj

jobs:
  build:
    name: Build Browser AOT
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout Browser build submodules
        shell: bash
        run: |
          # AcbGeneratorFuck is only referenced by Desktop and requires separate repository access.
          git submodule update --init --recursive \
            Dependences/MigratableSerializer \
            Dependences/Polyline2D.CSharp \
            Dependences/earcut.net \
            Avalonia/Dependencies/Gekimini.Avalonia \
            Avalonia/Dependencies/NAudio.BrowserAudioWorklet

      - name: Setup .NET 10 with WebAssembly tools
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          workloads: wasm-tools

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Restore Browser project
        run: dotnet restore "$BROWSER_PROJECT" --nologo --verbosity minimal -r browser-wasm

      - name: Publish Browser Release AOT
        run: >-
          dotnet publish "$BROWSER_PROJECT"
          --configuration Release
          --no-restore
          --output "${{ runner.temp }}/browser-publish"
          --nologo
          --verbosity minimal
          -p:RunAOTCompilation=true

      - name: Validate Pages artifact
        shell: bash
        run: |
          site_root="${{ runner.temp }}/browser-publish/wwwroot"
          test -f "$site_root/index.html"
          test -d "$site_root/_framework"
          find "$site_root/_framework" -maxdepth 1 -type f -name '*.wasm' -print -quit | grep -q .
          grep -ERq 'runAOTCompilation[[:space:]]*:[[:space:]]*true' "$site_root/_framework"/dotnet.native*.js
          touch "$site_root/.nojekyll"

      - name: Upload Browser artifact for Github Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/browser-publish/wwwroot
          include-hidden-files: true

      - name: Upload Browser artifact for Cloudflare Pages
        uses: actions/upload-artifact@v4
        with:
          name: browser-site
          path: ${{ runner.temp }}/browser-publish/wwwroot
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    name: Deploy Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Browser artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-site
          path: ${{ runner.temp }}/browser-publish/wwwroot

      - name: Delete OverSize Files
        shell: bash
        run: |
          site_root="${{ runner.temp }}/browser-publish/wwwroot"
          max_size=26214400
          deleted=0

          echo "Checking Cloudflare Pages asset size limit: 25 MiB (${max_size} bytes)"

          while IFS= read -r -d '' file; do
            size="$(stat -c '%s' "$file")"
            size_mib="$(awk -v size="$size" 'BEGIN { printf "%.2f", size / 1048576 }')"
            echo "Deleting oversized file: ${file#"$site_root"/} (${size} bytes, ${size_mib} MiB)"
            rm -f "$file"
            deleted=$((deleted + 1))
          done < <(find "$site_root" -type f -size +26214400c -print0)

          if [ "$deleted" -eq 0 ]; then
            echo "No oversized files found."
          else
            echo "Deleted $deleted oversized file(s)."
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGE_WRITE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ongeki-fumen-editor
          directory: "${{ runner.temp }}/browser-publish/wwwroot"
          wranglerVersion: '3'
