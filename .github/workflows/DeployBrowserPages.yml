name: Deploy Browser to GitHub and Cloudflare Pages

on:
  push:
    branches:
      - avalonia
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  BROWSER_PROJECT: Avalonia/src/OngekiFumenEditor.Avalonia.Browser/OngekiFumenEditor.Avalonia.Browser.csproj

jobs:
  build:
    name: Build Browser AOT (${{ matrix.flavour }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # One runner per WasmEnableThreads flavour.
    #
    # WasmEnableThreads selects a different runtime pack
    # (Microsoft.NETCore.App.Runtime.Mono.browser-wasm vs Mono.multithread.browser-wasm),
    # and dotnet.runtime.js is copied verbatim from that pack.  The two flavours ship
    # different JS: the multithread one resolves mono_wasm_invoke_jsexport_async_post /
    # _sync / _sync_send, which only the multithread native module exports.
    #
    # WasmEnableThreads is NOT part of the intermediate path, so publishing both flavours
    # on one runner lets the second publish inherit the first one's staged
    # dotnet.runtime.js while the native module is relinked for the requested flavour.
    # That mixed bundle dies in the preRun hook with
    # "cwrap mono_wasm_invoke_jsexport_async_post not found or not a function".
    # Separate runners keep obj/bin apart; the Validate step below asserts the result.
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: st
            threads: 'false'
          - flavour: mt
            threads: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout Browser build submodules
        shell: bash
        run: |
          # AcbGeneratorFuck is only referenced by Desktop and requires separate repository access.
          git submodule update --init --recursive \
            Dependences/MigratableSerializer \
            Dependences/earcut.net \
            Avalonia/Dependencies/Gekimini.Avalonia \
            Avalonia/Dependencies/NAudio.BrowserAudioWorklet

      - name: Setup .NET 11 with WebAssembly tools
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100-preview.7.26381.103
      - name: Install WebAssembly tools workload
        run: dotnet workload install wasm-tools --include-previews

      - name: Configure GitHub Pages
        if: matrix.flavour == 'st'
        uses: actions/configure-pages@v6

      - name: Publish Browser Release AOT (${{ matrix.flavour }})
        run: >-
          dotnet publish "$BROWSER_PROJECT"
          --configuration Release
          --output "${{ runner.temp }}/browser-publish/wwwroot"
          --nologo
          --verbosity minimal
          -p:RunAOTCompilation=true
          -p:WasmEnableThreads=${{ matrix.threads }}

      - name: Dump Publish Build Files/Directories
        shell: bash
        run: |
          root="${{ runner.temp }}/browser-publish"

          echo "========================================"
          echo "Publish Build Directory Tree"
          echo "Root: $root"
          echo "========================================"

          format_size() {
            local size="$1"

            if [ "$size" -lt 1024 ]; then
              printf "%d B" "$size"
            elif [ "$size" -lt 1048576 ]; then
              awk -v size="$size" 'BEGIN { printf "%.2f KB", size / 1024 }'
            elif [ "$size" -lt 1073741824 ]; then
              awk -v size="$size" 'BEGIN { printf "%.2f MB", size / 1048576 }'
            else
              awk -v size="$size" 'BEGIN { printf "%.2f GB", size / 1073741824 }'
            fi
          }

          dump_tree() {
            local dir="$1"
            local prefix="$2"

            local entries=()
            while IFS= read -r -d '' entry; do
              entries+=("$entry")
            done < <(find "$dir" -mindepth 1 -maxdepth 1 -print0 | sort -z)

            local count="${#entries[@]}"
            local index=0

            for entry in "${entries[@]}"; do
              index=$((index + 1))

              if [ "$index" -eq "$count" ]; then
                branch="└── "
                child_prefix="${prefix}    "
              else
                branch="├── "
                child_prefix="${prefix}│   "
              fi

              name="$(basename "$entry")"

              if [ -d "$entry" ]; then
                echo "${prefix}${branch}${name}/"
                dump_tree "$entry" "$child_prefix"
              elif [ -f "$entry" ]; then
                size="$(stat -c '%s' "$entry")"
                echo "${prefix}${branch}${name} ($(format_size "$size"))"
              else
                echo "${prefix}${branch}${name}"
              fi
            done
          }

          echo "browser-publish/"
          dump_tree "$root" ""

          echo "========================================"

      - name: Validate Browser artifact (${{ matrix.flavour }})
        shell: bash
        run: |
          site_root="${{ runner.temp }}/browser-publish/wwwroot"
          test -f "$site_root/index.html"
          test -d "$site_root/_framework"
          find "$site_root/_framework" -maxdepth 1 -type f -name '*.wasm' -print -quit | grep -q .
          grep -ERq 'runAOTCompilation[[:space:]]*:[[:space:]]*true' "$site_root/_framework"/dotnet.native*.js

          # Fail the build when dotnet.runtime.js, dotnet.native.wasm and the embedded
          # wasmEnableThreads literal do not all agree with the requested flavour.
          # This is the check that catches a mixed single-thread bundle before it ships.
          python3 .github/scripts/assert-wasm-runtime-consistency.py \
            "$site_root/_framework" \
            --expect-threads ${{ matrix.threads }}

          touch "$site_root/.nojekyll"

      - name: Upload Browser artifact for Github Pages
        # Only the single-threaded flavour can run on GitHub Pages: threads need
        # cross-origin isolation, which needs COOP/COEP response headers that
        # GitHub Pages cannot serve.
        if: matrix.flavour == 'st'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/browser-publish/wwwroot
          include-hidden-files: true

      - name: Upload Browser artifact for Cloudflare Pages
        # Cloudflare Pages can serve COOP/COEP, so it gets the multithread flavour.
        if: matrix.flavour == 'mt'
        uses: actions/upload-artifact@v4
        with:
          name: browser-site-mt
          path: ${{ runner.temp }}/browser-publish/wwwroot
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    name: Deploy Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download Browser artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-site-mt
          path: ${{ runner.temp }}/browser-publish/wwwroot

      - name: Delete OverSize Files
        shell: bash
        run: |
          site_root="${{ runner.temp }}/browser-publish/wwwroot"
          max_size=26214400
          deleted=0

          echo "Checking Cloudflare Pages asset size limit: 25 MiB (${max_size} bytes)"

          while IFS= read -r -d '' file; do
            size="$(stat -c '%s' "$file")"
            size_mib="$(awk -v size="$size" 'BEGIN { printf "%.2f", size / 1048576 }')"
            echo "Deleting oversized file: ${file#"$site_root"/} (${size} bytes, ${size_mib} MiB)"
            rm -f "$file"
            deleted=$((deleted + 1))
          done < <(find "$site_root" -type f -size +26214400c -print0)

          if [ "$deleted" -eq 0 ]; then
            echo "No oversized files found."
          else
            echo "Deleted $deleted oversized file(s)."
          fi

      - name: Publish to Cloudflare Pages
        # cloudflare/pages-action no longer exists on GitHub, so call wrangler directly.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGE_WRITE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "${{ runner.temp }}/browser-publish/wwwroot" --project-name=ongeki-fumen-editor
          wranglerVersion: '3'
