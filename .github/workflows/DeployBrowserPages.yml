name: Deploy Browser to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  BROWSER_PROJECT: Avalonia/src/OngekiFumenEditor.Avalonia.Browser/OngekiFumenEditor.Avalonia.Browser.csproj

jobs:
  build:
    name: Build Browser AOT
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET 10 with WebAssembly tools
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          workloads: wasm-tools

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Restore Browser project
        run: dotnet restore "$BROWSER_PROJECT" --nologo --verbosity minimal

      - name: Publish Browser Release AOT
        run: >-
          dotnet publish "$BROWSER_PROJECT"
          --configuration Release
          --no-restore
          --output "${{ runner.temp }}/browser-publish"
          --nologo
          --verbosity minimal
          -p:RunAOTCompilation=true

      - name: Validate Pages artifact
        shell: bash
        run: |
          site_root="${{ runner.temp }}/browser-publish/wwwroot"
          test -f "$site_root/index.html"
          test -d "$site_root/_framework"
          find "$site_root/_framework" -maxdepth 1 -type f -name '*.wasm' -print -quit | grep -q .
          grep -ERq 'runAOTCompilation[[:space:]]*:[[:space:]]*true' "$site_root/_framework"/dotnet.native*.js
          touch "$site_root/.nojekyll"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/browser-publish/wwwroot
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
