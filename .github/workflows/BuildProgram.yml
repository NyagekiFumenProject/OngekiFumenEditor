name: Build Program

on:
  push:
  workflow_dispatch:
    inputs:
      BuildBranch:
        description: 'The branch you want to build.'
        required: true
        default: 'master'
      BuildConfiguration:
        description: 'The configuration for dotnet build.'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

env:
  Configuration: ${{ github.event.inputs.BuildConfiguration || 'Release' }}
  Branch: ${{ github.event.inputs.BuildBranch || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Get current time
      uses: josStorer/get-current-time@v2
      id: current-time
      with:
        format: YYYYMMDDHHMMSS
        utcOffset: "+08:00"
    - uses: benjlevesque/short-sha@v2.2
      id: short-sha
      with:
        length: 6
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
        ref: ${{ env.Branch }}
        submodules: false
    # Only the WPF-side dependencies are needed here. The Avalonia submodules under
    # Avalonia/Dependencies require separate repository access (AcbGeneratorFuck is private),
    # so a recursive checkout would fail; they are intentionally not initialized.
    - name: Init build submodules
      run: git submodule update --init --recursive Dependences/gemini Dependences/SvgToXaml Dependences/MigratableSerializer
    - name: Setup .NET11
      uses: actions/setup-dotnet@v4.3.1
      with:
        dotnet-version: 11.0.100-preview.7.26381.103
    - name: Install WebAssembly tools workload
      run: dotnet workload install wasm-tools --include-previews
    - name: get-version-action
      id: project-version
      uses: euberdeveloper/ga-project-version@main
      with:
        path: .\OngekiFumenEditor\version.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Publish OngekiFumenEditor
      run: dotnet publish .\OngekiFumenEditor\OngekiFumenEditor.csproj --no-restore -c ${{env.Configuration}} -o C:\ogkrEditorBuild\
    - name: Publish OngekiFumenEditor.CommandLine
      run: dotnet publish .\OngekiFumenEditor.CommandLine\OngekiFumenEditor.CommandLine.csproj --no-restore -c ${{env.Configuration}} -o C:\editorCmdBuild\
    - name: Combine CommandLine into OngekiFumenEditor
      run: xcopy "C:\editorCmdBuild\" "C:\ogkrEditorBuild\" /E /Y /I
    - name: Delete unused .xml files
      run: Remove-Item -Path "C:\ogkrEditorBuild\*.xml" -Force
    - name: Delete unused .pdb files
      shell: pwsh
      run: |
        Get-ChildItem -Path "C:\ogkrEditorBuild" -Filter "*.pdb" -File -Recurse |
          Remove-Item -Force
    - name: Prepare artifact branch name
      shell: pwsh
      run: |
        $artifactBranch = $env:Branch -replace '[\\/:*?"<>|\r\n]', '-'
        "ArtifactBranch=$artifactBranch" >> $env:GITHUB_ENV
    - name: Read built editor version
      id: editor-version
      shell: pwsh
      run: |
        $exe = Join-Path "C:\ogkrEditorBuild" "OngekiFumenEditor.exe"
        if (-not (Test-Path -LiteralPath $exe)) {
          throw "Built editor executable not found: $exe"
        }
        $version = (Get-Item -LiteralPath $exe).VersionInfo.FileVersion
        if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^\d+(\.\d+){1,3}$') {
          throw "Unexpected built editor version: '$version'"
        }
        "version=$version" >> $env:GITHUB_OUTPUT
    - name: Package editor artifact zip
      id: package
      shell: pwsh
      run: |
        $zipName = "OngekiFumenEditor_${{ steps.editor-version.outputs.version }}_${{ env.ArtifactBranch }}_(GABuild${{ steps.current-time.outputs.formattedTime }}_${{ steps.short-sha.outputs.sha }}_${{ env.Configuration }}).zip"
        $zipPath = Join-Path $env:RUNNER_TEMP $zipName
        Compress-Archive -Path "C:\ogkrEditorBuild\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
        "path=$zipPath" >> $env:GITHUB_OUTPUT
        "name=$zipName" >> $env:GITHUB_OUTPUT
    - uses: actions/upload-artifact@v4
      with:
        name: OngekiFumenEditor_${{ steps.editor-version.outputs.version }}_${{ env.ArtifactBranch }}_(GABuild${{ steps.current-time.outputs.formattedTime }}_${{ steps.short-sha.outputs.sha }}_${{ env.Configuration }})
        path: ${{ steps.package.outputs.path }}
    - name: Push editor zip to fumen server
      if: github.repository == 'NyagekiFumenProject/OngekiFumenEditor' && env.Configuration == 'Release'
      shell: pwsh
      env:
        FUMEN_SERVER_ADMIN_PASSWORD: ${{ secrets.FUMEN_SERVER_ADMIN_PASSWORD }}
        EDITOR_ZIP_PATH: ${{ steps.package.outputs.path }}
        EDITOR_BRANCH: ${{ env.Branch }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:FUMEN_SERVER_ADMIN_PASSWORD)) {
          Write-Warning "FUMEN_SERVER_ADMIN_PASSWORD is not configured; skipping updateEditorZip."
          return
        }

        $form = @{
          zipFormFile = Get-Item -LiteralPath $env:EDITOR_ZIP_PATH
          password    = $env:FUMEN_SERVER_ADMIN_PASSWORD
          branch      = $env:EDITOR_BRANCH
        }

        try {
          $response = Invoke-RestMethod -Method Put `
            -Uri "https://fumen.nageki-net.com/editor/updateEditorZip" `
            -Form $form -TimeoutSec 600
          $response | ConvertTo-Json -Depth 5 | Write-Output
        }
        catch {
          $status = $_.Exception.Response.StatusCode.value__
          $body = $_.ErrorDetails.Message
          if ($status -eq 400 -and $body -match 'not newer') {
            Write-Warning "Server already has version ${{ steps.editor-version.outputs.version }}; skipping updateEditorZip. $body"
            return
          }
          throw "updateEditorZip failed (HTTP $status): $body"
        }
    
